<div class="app">
  <!-- スマホ用ヘッダー -->
  <header class="topbar" id="topbar">
    <a class="brand" href="#/" aria-label="IppO ホーム"><span class="brand-mark"></span><span class="brand-name">IppO</span></a>
    <div class="topbar-actions">
      <a class="icon-btn" href="#/search" aria-label="検索"><svg class="ic"><use href="#i-search"/></svg></a>
      <a class="icon-btn" href="#/notifications" aria-label="通知"><svg class="ic"><use href="#i-bell"/></svg><b class="dot-badge notif-badge hidden"></b></a>
      <a class="icon-btn" href="#/dm" aria-label="メッセージ"><svg class="ic"><use href="#i-mail"/></svg><b class="dot-badge dm-badge hidden"></b></a>
      <a class="topbar-avatar" href="#/me" id="topbar-avatar" aria-label="マイページ"></a>
    </div>
  </header>

  <!-- PC・タブレット用サイドバー -->
  <nav class="sidebar" aria-label="メインメニュー">
    <a class="brand" href="#/" aria-label="IppO ホーム"><span class="brand-mark"></span><span class="brand-name">IppO</span></a>
    <div class="nav-list">
      <a class="nav-item" href="#/" data-nav="home"><svg class="ic"><use href="#i-home"/></svg><span>ホーム</span></a>
      <a class="nav-item" href="#/search" data-nav="search"><svg class="ic"><use href="#i-compass"/></svg><span>発見</span></a>
      <a class="nav-item" href="#/c" data-nav="c"><svg class="ic"><use href="#i-users"/></svg><span>コミュニティ</span></a>
      <a class="nav-item" href="#/news" data-nav="news"><svg class="ic"><use href="#i-megaphone"/></svg><span>お知らせ</span><b class="count-badge news-badge hidden"></b></a>
      <a class="nav-item" href="#/notifications" data-nav="notifications"><svg class="ic"><use href="#i-bell"/></svg><span>通知</span><b class="count-badge notif-badge hidden"></b></a>
      <a class="nav-item" href="#/dm" data-nav="dm"><svg class="ic"><use href="#i-mail"/></svg><span>メッセージ</span><b class="count-badge dm-badge hidden"></b></a>
      <a class="nav-item" href="#/pixel" data-nav="pixel"><svg class="ic"><use href="#i-grid"/></svg><span>PIXEL WORLD</span></a>
      <a class="nav-item" href="#/games" data-nav="games"><svg class="ic"><use href="#i-game"/></svg><span>ミニゲーム</span></a>
      <a class="nav-item" href="#/schedule" data-nav="schedule"><svg class="ic"><use href="#i-calendar"/></svg><span>予定表</span></a>
      <a class="nav-item" href="#/bookmarks" data-nav="bookmarks"><svg class="ic"><use href="#i-bookmark"/></svg><span>ブックマーク</span></a>
      <a class="nav-item" href="#/me" data-nav="me"><svg class="ic"><use href="#i-user"/></svg><span>マイページ</span></a>
      <a class="nav-item hidden" href="#/admin" data-nav="admin" id="nav-admin"><svg class="ic"><use href="#i-shield"/></svg><span>管理</span></a>
      <a class="nav-item" href="#/settings" data-nav="settings"><svg class="ic"><use href="#i-settings"/></svg><span>設定</span></a>
    </div>
    <button class="btn btn-primary btn-lg compose-btn" type="button" data-compose><svg class="ic"><use href="#i-plus"/></svg><span>投稿する</span></button>
    <div class="account" id="account-box"></div>
  </nav>

  <main id="main" class="main" tabindex="-1"></main>

  <!-- PC 用の右カラム -->
  <aside class="rail">
    <form class="rail-search" id="rail-search" role="search">
      <svg class="ic"><use href="#i-search"/></svg>
      <input name="q" class="input" placeholder="IppO を検索" autocomplete="off">
    </form>
    <section class="panel" id="schedule-widget">
      <div class="panel-head"><h3>次の予定</h3><a href="#/schedule" class="link-sm">すべて見る</a></div>
      <div class="list"></div>
    </section>
    <section class="panel" id="trends">
      <div class="panel-head"><h3>トレンド</h3></div>
      <div class="list"></div>
    </section>
    <section class="panel" id="suggest">
      <div class="panel-head"><h3>おすすめのユーザー</h3></div>
      <div class="list"></div>
    </section>
    <section class="panel panel-quiet">
      <div class="panel-head"><h3><svg class="ic ic-sm"><use href="#i-shield"/></svg> 仮想ブラウザで保護</h3></div>
      <p class="text-sm muted">投稿内のリンクはサーバー上の使い捨てブラウザで開かれます。スクリプトやCookieはあなたの端末に届かず、閉じると履歴もすべて破棄されます。</p>
    </section>
    <p class="rail-foot">© IppO</p>
  </aside>

  <!-- スマホ用の下部ナビゲーション -->
  <nav class="tabbar" aria-label="メインメニュー">
    <a class="tab" href="#/" data-nav="home" aria-label="ホーム"><svg class="ic"><use href="#i-home"/></svg><span>ホーム</span></a>
    <a class="tab" href="#/c" data-nav="c" aria-label="コミュニティ"><svg class="ic"><use href="#i-users"/></svg><span>コミュニティ</span></a>
    <button class="tab tab-compose" type="button" data-compose aria-label="投稿する"><span class="tab-compose-btn"><svg class="ic"><use href="#i-plus"/></svg></span></button>
    <a class="tab" href="#/search" data-nav="search" aria-label="発見"><svg class="ic"><use href="#i-compass"/></svg><span>発見</span></a>
    <a class="tab" href="#/me" data-nav="me" aria-label="マイページ"><svg class="ic"><use href="#i-user"/></svg><span>マイページ</span></a>
  </nav>
</div>

<!-- 投稿作成 -->
<dialog id="compose-dialog" class="modal sheet" aria-labelledby="compose-title">
  <div class="modal-head">
    <button class="icon-btn" type="button" data-close aria-label="閉じる"><svg class="ic"><use href="#i-x"/></svg></button>
    <h2 class="modal-title" id="compose-title">新しい投稿</h2>
    <span class="modal-head-spacer"></span>
  </div>
  <div id="compose-modal-slot" class="modal-body"></div>
</dialog>

<!-- ログイン / 登録 -->
<dialog id="auth-dialog" class="modal sheet auth-modal" aria-labelledby="auth-title">
  <form id="auth-form" class="auth">
    <button class="icon-btn modal-x" type="button" data-close aria-label="閉じる"><svg class="ic"><use href="#i-x"/></svg></button>
    <div class="auth-brand"><span class="brand-mark lg"></span></div>
    <h2 id="auth-title" class="auth-title">ログイン</h2>
    <p class="auth-sub" id="auth-sub">IppO へようこそ</p>
    <div class="segmented" role="tablist">
      <button type="button" class="seg" data-auth-mode="login" role="tab">ログイン</button>
      <button type="button" class="seg" data-auth-mode="register" role="tab">新規登録</button>
    </div>
    <p class="notice reg-only hidden" id="invite-note"></p>
    <label class="field"><span class="field-label">ユーザー名</span>
      <input class="input" name="username" placeholder="例: taro_2026" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label class="field reg-only"><span class="field-label">表示名 <span class="muted">（任意）</span></span>
      <input class="input" name="displayName" placeholder="みんなに表示される名前" autocomplete="nickname"></label>
    <label class="field"><span class="field-label">パスワード</span>
      <input class="input" name="password" type="password" placeholder="8文字以上" autocomplete="current-password" required></label>
    <label class="field reg-only invite-field hidden"><span class="field-label">招待コード</span>
      <input class="input input-code" name="invite" placeholder="ABCDE12345" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
    <p class="form-error" id="auth-error" role="alert"></p>
    <button class="btn btn-primary btn-lg btn-block" type="submit" id="auth-submit">ログイン</button>
    <p class="auth-switch"><a href="#" id="auth-toggle">アカウントを作成</a></p>
  </form>
</dialog>

<!-- 汎用モーダル (確認・入力フォーム) -->
<dialog id="ui-dialog" class="modal sheet" aria-labelledby="ui-dialog-title">
  <div class="modal-head">
    <button class="icon-btn" type="button" data-close aria-label="閉じる"><svg class="ic"><use href="#i-x"/></svg></button>
    <h2 class="modal-title" id="ui-dialog-title"></h2>
    <span class="modal-head-spacer"></span>
  </div>
  <div class="modal-body" id="ui-dialog-body"></div>
</dialog>

<!-- 写真の拡大表示 -->
<dialog id="lightbox" class="lightbox" aria-label="写真">
  <button class="icon-btn lb-close" type="button" data-lb="close" aria-label="閉じる"><svg class="ic"><use href="#i-x"/></svg></button>
  <button class="icon-btn lb-prev" type="button" data-lb="prev" aria-label="前の写真"><svg class="ic"><use href="#i-back"/></svg></button>
  <img class="lb-img" alt="">
  <button class="icon-btn lb-next" type="button" data-lb="next" aria-label="次の写真"><svg class="ic"><use href="#i-forward"/></svg></button>
  <span class="lb-count"></span>
</dialog>

<!-- トースト通知 -->
<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- 投稿の「その他」メニュー -->
<div class="menu hidden" id="menu" role="menu"></div>

<!-- 仮想ブラウザ -->
<div id="vb" class="vb hidden" aria-hidden="true">
  <div class="vb-window">
    <div class="vb-bar">
      <button class="icon-btn" data-vb="back" title="戻る" aria-label="戻る"><svg class="ic"><use href="#i-back"/></svg></button>
      <button class="icon-btn" data-vb="forward" title="進む" aria-label="進む"><svg class="ic"><use href="#i-forward"/></svg></button>
      <button class="icon-btn" data-vb="reload" title="再読み込み" aria-label="再読み込み"><svg class="ic"><use href="#i-refresh"/></svg></button>
      <button class="icon-btn" data-vb="kbd" title="キーボードを開く" aria-label="キーボード"><svg class="ic"><use href="#i-keyboard"/></svg></button>
      <button class="icon-btn vb-mode" data-vb="mode" id="vb-mode" title="スマホ版 / PC版を切り替え" aria-label="表示モード"><svg class="ic"><use href="#i-phone"/></svg></button>
      <form id="vb-addr-form" class="vb-addr">
        <span class="vb-shield" title="仮想環境で隔離中"><svg class="ic ic-sm"><use href="#i-shield"/></svg><span>隔離中</span></span>
        <input id="vb-addr" spellcheck="false" autocomplete="off" aria-label="URL">
      </form>
      <span class="vb-timer" id="vb-timer"></span>
      <button class="icon-btn" data-vb="close" title="閉じて破棄" aria-label="閉じる"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="vb-stage" id="vb-stage">
      <canvas id="vb-canvas" width="1280" height="720" tabindex="0"></canvas>
      <textarea id="vb-ime" aria-hidden="true"></textarea>
      <div class="vb-overlay" id="vb-overlay">仮想環境を起動中…</div>
      <div class="vb-toast" id="vb-toast"></div>
      <button class="vb-kbd-float hidden" id="vb-kbd-float" type="button"><svg class="ic ic-sm"><use href="#i-keyboard"/></svg> 文字を入力</button>
    </div>
  </div>
</div>

<script src="/cards-art.js?v=4"></script>
<script src="/app.js?v=48"></script>
</body>
</html>
