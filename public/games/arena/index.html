<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>シティバトル</title>
<style>
:root{ --ink:#fff; --hud:rgba(10,12,30,.55); --accent:#ffd43b; --danger:#ff6b6b; color-scheme:dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0d1a;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none;z-index:5}
#cross{left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px}
#cross i{position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross i:nth-child(1){left:12px;top:0;width:2px;height:8px}#cross i:nth-child(2){left:12px;bottom:0;width:2px;height:8px}
#cross i:nth-child(3){top:12px;left:0;height:2px;width:8px}#cross i:nth-child(4){top:12px;right:0;height:2px;width:8px}
#cross.hit i{background:var(--danger)}
#hitmark{left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;opacity:0;transform:rotate(45deg)}
#hitmark i{position:absolute;background:#fff}#hitmark i:nth-child(1){left:16px;top:0;width:2px;height:10px}#hitmark i:nth-child(2){left:16px;bottom:0;width:2px;height:10px}#hitmark i:nth-child(3){top:16px;left:0;height:2px;width:10px}#hitmark i:nth-child(4){top:16px;right:0;height:2px;width:10px}
#hitmark.on{animation:hm .25s ease-out}#hitmark.head i{background:var(--accent)}
@keyframes hm{0%{opacity:1;transform:rotate(45deg) scale(1.4)}100%{opacity:0;transform:rotate(45deg) scale(1)}}
#hpbox{left:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:min(240px,44vw);background:var(--hud);border-radius:12px;padding:8px 10px}
#hpbox b{font-size:13px}#hpbar{height:10px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:4px}#hpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#69db7c,#a9e34b);transition:width .15s}
#hpbar.low i{background:linear-gradient(90deg,#ff6b6b,#ff922b)}
#ammo{right:14px;bottom:calc(14px + env(safe-area-inset-bottom));background:var(--hud);border-radius:12px;padding:8px 12px;font-weight:900;font-size:22px;text-align:right}
#ammo small{display:block;font-size:11px;font-weight:700;opacity:.8}
#feed{right:10px;top:calc(56px + env(safe-area-inset-top));display:grid;gap:4px;justify-items:end;max-width:62vw}
#feed div{background:var(--hud);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700;animation:fin .25s ease-out}
#feed .me{background:rgba(255,212,59,.35)}
@keyframes fin{from{transform:translateX(30px);opacity:0}}
#score{left:10px;top:calc(10px + env(safe-area-inset-top));background:var(--hud);border-radius:10px;padding:6px 10px;font-size:12px;min-width:150px}
#score b{display:block;font-size:13px;margin-bottom:2px}#score div{display:flex;justify-content:space-between;gap:10px}#score .you{color:var(--accent);font-weight:900}
#dmg{inset:0;background:radial-gradient(circle,transparent 55%,rgba(255,60,60,.55));opacity:0;transition:opacity .25s}
#prot{left:50%;top:22%;transform:translateX(-50%);font-weight:900;font-size:13px;background:rgba(116,143,252,.55);border-radius:999px;padding:3px 12px;display:none}
#center{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(5,6,18,.62);text-align:center;padding:20px}
#center.hide{display:none}
#center h1{margin:0 0 6px;font-size:34px;letter-spacing:.04em;background:linear-gradient(180deg,#fff,#ffd43b 60%,#ff922b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #000)}
#center p{margin:6px 0;font-size:14px;opacity:.92;line-height:1.6}
.btn{pointer-events:auto;border:0;border-radius:14px;padding:12px 22px;font:inherit;font-weight:900;font-size:17px;background:linear-gradient(135deg,#ffe066,#fab005);color:#3b1d00;box-shadow:0 4px 0 rgba(140,80,0,.5);cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.15);color:#fff;box-shadow:none;font-size:14px;padding:8px 14px}
#dead{position:fixed;inset:0;z-index:15;display:none;place-items:center;text-align:center;background:rgba(40,0,10,.35);pointer-events:none}
#dead b{display:block;font-size:40px;font-weight:900;color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill}
#dead span{font-size:15px;font-weight:700}
/* スマホの操作 */
body:not(.is-touch) .touch{display:none!important}
#stick{position:fixed;left:18px;bottom:calc(70px + env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);z-index:8;touch-action:none}
#stick:not(.float){opacity:.55} /* 左半分のどこでも、触ったところにスティックが出る */
#stick i{position:absolute;left:46px;top:46px;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.45)}
#fire,#jump,#reload,#punch,#weapon,#aim,#act{position:fixed;z-index:8;border-radius:50%;border:2px solid rgba(255,255,255,.35);color:#fff;font-weight:900;display:grid;place-items:center;touch-action:none}
/* ボタンは大きめ (指で押しやすく) */
#fire{right:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:112px;height:112px;background:rgba(255,107,107,.55);font-size:19px}
#jump{right:140px;bottom:calc(62px + env(safe-area-inset-bottom));width:74px;height:74px;background:rgba(255,255,255,.18);font-size:13px}
#punch{right:142px;bottom:calc(148px + env(safe-area-inset-bottom));width:82px;height:82px;background:rgba(255,146,43,.55);font-size:15px}
#weapon{right:150px;bottom:calc(244px + env(safe-area-inset-bottom));width:68px;height:68px;background:rgba(255,255,255,.18);font-size:13px}
#aim{left:36px;bottom:calc(236px + env(safe-area-inset-bottom));width:86px;height:86px;background:rgba(116,192,252,.35);font-size:14px} /* 左側: サイトをのぞく */
#act{right:22px;bottom:calc(290px + env(safe-area-inset-bottom));width:80px;height:80px;background:rgba(105,219,124,.55);font-size:15px;display:none} /* 乗る / 降りる */
body.is-touch #act.show{display:grid}
body.driving #fire,body.driving #jump,body.driving #punch,body.driving #weapon,body.driving #aim,body.driving #reload,body.driving #cross,body.driving #ammo{display:none!important} /* 運転中は撃たない */
body.driving #act{right:22px;bottom:calc(90px + env(safe-area-inset-bottom))}
#hint{left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--hud);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800}
#hint:empty{display:none}
#score .cash{color:#8ce99a;font-weight:900;margin-top:2px}
/* デバッグ (管理者) */
#dbgbtn{left:calc(50% + 144px)}
#dbg{position:fixed;z-index:30;right:8px;top:calc(56px + env(safe-area-inset-top));bottom:8px;width:min(440px,calc(100vw - 16px));overflow:auto;background:rgba(14,17,34,.94);border-radius:12px;padding:10px 12px;font-size:12px;pointer-events:auto;user-select:text;-webkit-user-select:text}
#dbg[hidden]{display:none}
#dbg h4{margin:10px 0 4px;font-size:13px}
.dbg-head{display:flex;align-items:center;gap:8px}.dbg-head span{opacity:.7;flex:1}.dbg-x{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:2px 8px;font-size:14px}
.dbg-bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.dbg-bar button{border:0;border-radius:8px;padding:6px 8px;background:#364fc7;color:#fff;font:inherit;font-weight:800}
.dbg-sum div{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08);padding:2px 0}
.dbg-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;max-width:240px}.dbg-grid div{aspect-ratio:1;display:grid;place-items:center;border-radius:4px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000}.dbg-grid div.me{outline:2px solid #fff}
.dbg-legend,.dbg-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.dbg-legend span{border-left:8px solid;padding:0 4px;font-size:11px}.dbg-tags span{background:rgba(255,255,255,.1);border-radius:6px;padding:1px 6px}
#dbg table{width:100%;border-collapse:collapse;font-size:11px}#dbg th,#dbg td{text-align:left;padding:2px 3px;border-bottom:1px solid rgba(255,255,255,.07);white-space:nowrap}
#dbg pre{white-space:pre-wrap;font-size:11px;opacity:.8;margin:0}
#aim.on{background:rgba(116,192,252,.75);border-color:#fff}
body.aiming:not(.scoped) #cross{opacity:.35;transform:scale(.6)} /* ライフルでのぞくと、照準はサイトにまかせて小さく */
/* スコープ: まわりは黒・まん中に十字 */
#scopeov{position:fixed;inset:0;z-index:4;pointer-events:none;display:none;background:radial-gradient(circle at 50% 50%,transparent 0,transparent min(34vw,34vh),rgba(0,0,0,.92) calc(min(34vw,34vh) + 2px))}
#scopeov i{position:absolute;left:50%;top:50%;width:min(68vw,68vh);height:min(68vw,68vh);transform:translate(-50%,-50%);border-radius:50%;box-shadow:inset 0 0 40px rgba(0,0,0,.8);background:linear-gradient(#000,#000) center/1px 100% no-repeat,linear-gradient(#000,#000) center/100% 1px no-repeat}
body.scoped #scopeov{display:block} body.scoped #cross{display:none}
#reload{right:28px;bottom:calc(204px + env(safe-area-inset-bottom));width:66px;height:66px;background:rgba(255,255,255,.18);font-size:13px}
@media (prefers-reduced-motion:reduce){#feed div,#hitmark.on{animation:none}}
/* 設定 */
.hud-btn{position:fixed;z-index:25;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translateX(-50%);border:0;border-radius:999px;background:var(--hud);color:#fff;font-size:18px;width:40px;height:40px;cursor:pointer}
#exitbtn{font-size:16px;font-weight:900} #gear{left:calc(50% + 48px)} #fsbtn{left:calc(50% + 96px)} /* ✕・⚙️・⛶ は左上のキル数とかさならないよう、まん中から右へ */
#settings{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(5,6,18,.7);padding:16px}
#settings[hidden]{display:none}
.set-box{width:min(460px,100%);max-height:88vh;overflow:auto;background:#161a2e;border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.set-box h3{margin:6px 0 2px;font-size:15px}
.set-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;font-size:14px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.set-row small{grid-column:1/-1;opacity:.65;font-size:11px}
.set-row input[type=checkbox]{width:22px;height:22px}
.set-range{display:flex;align-items:center;gap:6px}.set-range input{width:130px}.set-range output{min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.set-row select{font:inherit;padding:4px 8px;border-radius:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="cross"><i></i><i></i><i></i><i></i></div>
<div class="hud" id="hitmark"><i></i><i></i><i></i><i></i></div>
<div class="hud" id="dmg"></div>
<div class="hud" id="prot">🛡️ 無敵中</div>
<div class="hud" id="hpbox"><b id="hptxt">HP 100</b><div id="hpbar"><i></i></div></div>
<div class="hud" id="ammo"><span id="ammotxt">30</span><small id="ammosub">/ 30</small></div>
<div class="hud" id="feed"></div>
<div class="hud" id="score"></div>
<div id="dead"><div><b>やられた！</b><span id="deadby"></span></div></div>
<div class="touch" id="stick"><i></i></div>
<div class="touch" id="fire">うつ</div>
<div class="touch" id="jump">ジャンプ</div>
<div class="touch" id="reload">リロード</div>
<div class="touch" id="punch">なぐる</div>
<div class="touch" id="weapon">武器</div>
<div class="touch" id="aim">のぞく</div>
<div class="touch" id="act">乗る</div>
<div class="hud" id="hint"></div>
<div id="scopeov" aria-hidden="true"><i></i></div>
<div id="center"><div>
  <h1>シティバトル</h1>
  <p>街じゅうのプレイヤーと撃ちあうバトル。<br>たおした数をきそおう！ やられても 3 秒で復活します。</p>
  <p id="howto"></p>
  <p id="status" style="color:var(--accent)"></p>
  <button class="btn" id="start" disabled>じゅんび中…</button>
</div></div>
<script src="arena-map.js?v=2"></script>
<script type="module" src="game.js?v=24"></script>
</body>
</html>
