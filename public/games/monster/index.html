<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ブリードモンスターズ</title>
<style>
:root{
  --bg:#f3f1ff; --surface:#fff; --surface2:#f1effb; --ink:#23224a; --muted:#6b6b8f; --line:#e2ddf7;
  --primary:#5b4cf0; --on-primary:#fff; --gold:#fab005; --danger:#e03131; --ok:#2f9e44;
  --fire:#ff6b35; --water:#1c7ed6; --grass:#2f9e44; --light:#f59f00; --dark:#7048e8; --king:#e67700;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#15142b; --surface:#211f3d; --surface2:#2a2850; --ink:#f0eeff; --muted:#b5b1d8; --line:#3a3666; color-scheme: dark; } }
:root[data-theme="dark"]{ --bg:#15142b; --surface:#211f3d; --surface2:#2a2850; --ink:#f0eeff; --muted:#b5b1d8; --line:#3a3666; color-scheme: dark; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:10px 12px 90px;max-width:760px;margin:0 auto}
button{font:inherit;cursor:pointer}
.mb-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mb-head h1{margin:0;font-size:20px;font-weight:900;flex:1;display:flex;align-items:center;gap:6px}
.mb-head h1 small{font-size:11px;color:var(--muted);font-weight:700}
.mb-coins{padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:900;font-size:14px;white-space:nowrap}
.btn{border:0;border-radius:14px;padding:10px 14px;font-weight:800;background:var(--surface2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:0 4px 0 rgba(40,30,140,.35)}
.btn.gold{background:linear-gradient(135deg,#ffe066,#fab005);color:#4a2a00;box-shadow:0 4px 0 rgba(140,80,0,.35)}
.btn.danger{background:#fff0f0;color:var(--danger)}
.btn.sm{padding:6px 10px;border-radius:10px;font-size:13px}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.card h2{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:6px}
.muted{color:var(--muted)} .small{font-size:12px} .center{text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.menu .btn{flex-direction:column;padding:12px 8px;font-size:15px;min-height:72px}
.menu .btn small{font-size:11px;font-weight:600;opacity:.85}
.mcard{position:relative;display:block;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:6px 6px 8px;text-align:center;color:inherit;text-decoration:none;cursor:pointer}
.mcard .ma-svg{width:100%;height:auto;aspect-ratio:1}
.mcard b{display:block;font-size:14px;margin-top:2px}
.mcard .meta{font-size:11px;color:var(--muted)}
.mcard.sel{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,76,240,.25)}
.mcard.dim{opacity:.5}
.rk{position:absolute;top:6px;left:6px;min-width:26px;padding:1px 6px;border-radius:8px;font-weight:900;font-size:13px;color:#fff;background:#868e96;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.rk.r-B{background:#1c7ed6}.rk.r-A{background:#2f9e44}.rk.r-S{background:#e67700}.rk.r-SS{background:linear-gradient(135deg,#f06595,#cc5de8)}.rk.r-Z{background:linear-gradient(135deg,#ff6b6b,#ffd43b,#51cf66,#4dabf7,#cc5de8);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.sx{position:absolute;top:6px;right:8px;font-weight:900;font-size:15px}.sx.m{color:#1c7ed6}.sx.f{color:#e64980}
.st{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:800;background:var(--surface2)}
.st.training{background:#fff3bf;color:#a35a00}.st.active{background:#d3f9d8;color:#2b8a3e}.st.breeding{background:#ffdeeb;color:#c2255c}.st.listed,.st.auction{background:#e5dbff;color:#5f3dc4}
.ty{display:inline-flex;align-items:center;gap:2px;font-weight:800;font-size:12px}
.val{font-weight:900;color:#e67700}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#74c0fc,#5b4cf0)}
.skl{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;background:var(--surface2);margin-top:6px}
.skl b{flex:1;font-size:14px}.skl .kd{font-size:10px;font-weight:900;padding:1px 6px;border-radius:6px;color:#fff}
.kd.punch{background:#e8590c}.kd.magic{background:#5b4cf0}.kd.ult{background:linear-gradient(135deg,#e03131,#fab005)}
.cmd{font-family:ui-monospace,monospace;font-weight:900;letter-spacing:1px;white-space:nowrap}
.tab{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}
.big-art{display:block;margin:0 auto;width:min(72vw,280px);height:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#23224a;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:99;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.err{background:#c92a2a}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.in{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:var(--surface);color:var(--ink);width:100%}
.lin{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lin .mcard{cursor:default}
.empty{padding:20px;text-align:center;color:var(--muted)}
/* ---- 演出 ---- */
@keyframes pop{0%{transform:scale(0) rotate(-10deg)}60%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes flipc{0%{transform:rotateY(0)}100%{transform:rotateY(1800deg)}}
@keyframes rise{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes cutin{0%{transform:translateX(-120%) skewX(-12deg)}18%{transform:translateX(0) skewX(-12deg)}82%{transform:translateX(0) skewX(-12deg)}100%{transform:translateX(120%) skewX(-12deg)}}
@keyframes flash{0%{opacity:0}20%{opacity:.85}100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes eggw{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.ma-rays{transform-box:view-box;transform-origin:60px 64px;animation:spin 18s linear infinite}
.ma-halo{transform-box:view-box;transform-origin:60px 64px;animation:spin 6s linear infinite}
/* モンスターの待機アニメ (軽い transform と opacity だけ) */
.ma-idle{transform-box:view-box;transform-origin:60px 112px;animation:ma-breath 2.6s ease-in-out infinite}
.ma-idle.float{animation:ma-float 3s ease-in-out infinite}
.ma-eye{transform-box:view-box;animation:ma-blink 4.6s infinite}
.ma-flap{transform-box:view-box;transform-origin:60px 70px;animation:ma-flap 1.8s ease-in-out infinite}
.ma-flick{transform-box:fill-box;transform-origin:50% 100%;animation:ma-flick .7s ease-in-out infinite alternate}
.ma-ember,.ma-mote{animation:ma-rise 2.4s ease-in infinite}.ma-ember.d1,.ma-mote.d1{animation-delay:.8s}.ma-ember.d2,.ma-mote.d2{animation-delay:1.6s}
.ma-bub{animation:ma-rise 3s ease-in-out infinite}.ma-bub.d1{animation-delay:1s}.ma-bub.d2{animation-delay:2s}
.ma-sway{transform-box:fill-box;transform-origin:50% 100%;animation:ma-sway 2.2s ease-in-out infinite alternate}
.ma-glow,.ma-pulse{animation:ma-glow 1.8s ease-in-out infinite alternate}
.ma-tw{transform-box:fill-box;transform-origin:50% 50%;animation:ma-tw 1.6s ease-in-out infinite}.ma-tw.d2{animation-delay:.5s}.ma-tw.d3{animation-delay:1s}
.ma-flo{animation:ma-flo 2.4s ease-in-out infinite}
.ma-wisp{transform-box:fill-box;transform-origin:50% 0;animation:ma-wisp 1.6s ease-in-out infinite alternate}
.ma-gshadow{transform-box:fill-box;transform-origin:50% 50%;animation:ma-gsh 3s ease-in-out infinite}
@keyframes ma-breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes ma-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes ma-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes ma-flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.9)}}
@keyframes ma-flick{from{transform:scale(1,1)}to{transform:scale(.9,1.12)}}
@keyframes ma-rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
@keyframes ma-sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes ma-glow{from{opacity:.6}to{opacity:1}}
@keyframes ma-tw{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.1);opacity:1}}
@keyframes ma-flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes ma-wisp{from{transform:skewX(-6deg)}to{transform:skewX(6deg)}}
@keyframes ma-gsh{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}
/* 選んだとき・バトル登場 */
.mcard:active .ma-idle,.mcard.sel .ma-idle{animation:ma-hop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes ma-hop{0%{transform:translateY(0)}40%{transform:translateY(-10px) scale(1.04)}100%{transform:translateY(0)}}
@keyframes ma-enter{0%{transform:translateY(30px) scale(.3);opacity:0;filter:brightness(3)}60%{opacity:1;filter:brightness(1.6)}100%{transform:none;filter:none}}
@media (prefers-reduced-motion: reduce){.ma-rays,.ma-halo,.ma-idle,.ma-eye,.ma-flap,.ma-flick,.ma-ember,.ma-mote,.ma-bub,.ma-sway,.ma-glow,.ma-pulse,.ma-tw,.ma-flo,.ma-wisp,.ma-gshadow,.ftr .mon{animation:none!important}}
/* ---- バトル ---- */
.bt{position:relative;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#3b2f8f,#14123a 70%);color:#fff;padding:10px;min-height:520px}
.bt-side{display:flex;align-items:center;gap:8px}
.bt-side.foe{flex-direction:row-reverse;text-align:right}
.bt-side .ma-svg{width:110px;height:110px;flex:none}
.bt-info{flex:1;min-width:0}
.bt-info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp{height:12px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:4px}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#51cf66,#94d82d);transition:width .6s ease}
.hp i.low{background:linear-gradient(90deg,#ff6b6b,#fa5252)}
.bt-mid{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:8px;margin:8px 0}
.slots{display:flex;flex-wrap:wrap;gap:4px;min-height:44px;padding:6px;border-radius:12px;background:rgba(0,0,0,.35);border:2px dashed rgba(255,255,255,.35);align-content:flex-start}
.slots span{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:900;background:#fff;color:#23224a;animation:pop .2s ease}
.queue{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.queue span{padding:2px 8px;border-radius:999px;font-size:12px;font-weight:900;background:#ffe066;color:#4a2a00;animation:pop .25s ease}.queue span.ng{background:#868e96;color:#fff}
/* バトルの舞台 (ドット絵風・キャラは横ならび) */
.stage{position:relative;height:230px;border-radius:14px;overflow:hidden;margin-bottom:8px;border:3px solid #0b0a24;box-shadow:inset 0 0 0 2px #4c3fbf}
.pixbg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.pl{position:absolute;top:6px;width:46%;padding:4px 6px;background:#0b0a24;border:2px solid #fff;border-radius:4px;box-shadow:3px 3px 0 #0b0a24;font-size:12px;z-index:3}
.pl.me{left:6px}.pl.foe{right:6px;text-align:right}
.pl b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .pl-sub{font-size:10px;opacity:.85}
.pl .hp{height:9px;border-radius:0;border:1px solid #fff;margin-top:2px}.pl .hp i{border-radius:0}
.pl .small{font-family:ui-monospace,monospace;font-size:10px}
.ftr{position:absolute;bottom:20px;width:108px;height:108px;z-index:2;transition:transform .23s cubic-bezier(.3,.7,.3,1)}
.ftr.me{left:8%}.ftr.foe{right:8%}
.ftr .mon{width:100%;height:100%;animation:ma-enter .7s cubic-bezier(.2,1.4,.4,1) both,bob 1.6s ease-in-out .7s infinite}
.ftr.foe .mon{animation-delay:.8s}
.ftr .mon .ma-svg{width:100%;height:100%}
.ftr.me .mon .ma-svg{transform:scaleX(-1)}
.ftr .shadow{position:absolute;left:20%;right:20%;bottom:-6px;height:8px;background:rgba(0,0,0,.35);border-radius:50%}
.ftr.dash{transform:translateX(var(--dash))}
.ftr.cast .mon{filter:drop-shadow(0 0 10px #fff)}
.ftr.charge .mon{animation:charge .12s linear infinite;filter:drop-shadow(0 0 16px #ffe066) brightness(1.3)}
.ftr.hit .mon{animation:hitflash .45s steps(2) 1}
.ftr.fizzle .mon{animation:fizzle .8s ease}
.ftr.ko .mon{animation:none;transform:translateY(30px) rotate(90deg);opacity:.35;filter:grayscale(1);transition:all .6s}
.slog{position:absolute;left:6px;right:6px;bottom:4px;padding:2px 8px;font-size:11px;font-weight:800;background:#0b0a24;border:2px solid #fff;border-radius:4px;z-index:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage.dim::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:1}
.stage.dim .ftr{z-index:4}
.stage.jolt{animation:shake .25s ease}
.stage.quake{animation:shake .45s ease 2}
.spr{position:absolute;z-index:6;pointer-events:none;transform:translate(-50%,-50%);line-height:0}
.spr svg{image-rendering:pixelated;filter:drop-shadow(0 0 6px rgba(255,255,255,.6))}
.spr.impact{animation:impact .55s steps(4) both}
.spr.impact.big{animation-duration:.6s}
.spr.px{width:6px;height:6px;animation:pxfly .65s steps(6) both}
.spr.trail{width:5px;height:5px;opacity:.8;animation:trail .4s steps(3) both}
.spr.chargering{width:110px;height:110px;border:6px dashed;border-radius:50%;animation:chargering .65s steps(5) both}
.beam{position:absolute;height:44px;z-index:5;pointer-events:none;background:repeating-linear-gradient(90deg,var(--c1) 0 8px,var(--c2) 8px 16px);box-shadow:0 0 0 4px var(--c3),0 0 30px 10px var(--c2);animation:beamin .26s steps(4) both}
.beam::after{content:'';position:absolute;left:0;right:0;top:14px;height:16px;background:var(--c3)}
.beam.out{animation:beamout .3s steps(3) both}
.ci.short{animation-duration:1s;top:24%;padding:8px 10px}.ci.short b{font-size:24px}
.pdmg{position:absolute;transform:translateX(-50%);z-index:7;font-family:ui-monospace,monospace;font-weight:900;font-size:28px;color:#fff;text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000,3px 3px 0 #c92a2a;animation:pdmg 1.1s steps(8) both;text-align:center;white-space:nowrap}
.pdmg small{display:block;font-size:12px;color:#ffe066}
.pdmg.good{color:#ffe066}.pdmg.big{font-size:38px}.pdmg.bad{color:#a5d8ff;font-size:22px}.pdmg.miss{font-size:20px;color:#ced4da}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes charge{0%{transform:translate(-2px,0)}50%{transform:translate(2px,-1px)}100%{transform:translate(-1px,1px)}}
@keyframes hitflash{0%{filter:brightness(3) saturate(0);transform:translateX(6px)}100%{filter:none;transform:translateX(-4px)}}
@keyframes fizzle{0%,100%{transform:none}30%{transform:translateY(-6px) rotate(-6deg)}60%{transform:translateY(0) rotate(6deg)}}
@keyframes impact{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
@keyframes pxfly{0%{transform:translate(-50%,-50%);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)));opacity:0}}
@keyframes trail{0%{opacity:.9}100%{opacity:0;transform:translate(-50%,-50%) scale(.3)}}
@keyframes chargering{0%{transform:translate(-50%,-50%) scale(1.6) rotate(0);opacity:.3}100%{transform:translate(-50%,-50%) scale(.5) rotate(180deg);opacity:1}}
@keyframes beamin{0%{transform:scaleX(0) scaleY(.4)}100%{transform:scaleX(1) scaleY(1)}}
@keyframes beamout{0%{transform:scaleY(1);opacity:1}100%{transform:scaleY(0);opacity:0}}
@keyframes pdmg{0%{transform:translate(-50%,10px) scale(.6);opacity:0}20%{transform:translate(-50%,-6px) scale(1.2);opacity:1}40%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-24px);opacity:0}}
@media (prefers-reduced-motion: reduce){.ftr .mon{animation:none}.stage.quake,.stage.jolt{animation:none}}
/* 入力の画面: 高さを固定して、キーを押してもボタンが動かないように */
#ctrl .prompt{min-height:50px;margin:6px 0 2px}#ctrl .prompt small{display:block;font-size:11px;opacity:.8;min-height:14px}
#ctrl .queue{min-height:26px;max-height:26px;overflow:hidden;margin:4px 0}
#ctrl .slots{height:72px;overflow:hidden;align-content:flex-start}
#ctrl .slots span{width:26px;height:26px;font-size:15px}
.hintline{height:20px;margin:3px 0;font-size:12px;font-weight:800;color:#ffe066;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hintline.miss{color:#ffa8a8}
.ctlmode{display:flex;gap:4px;justify-content:center;margin:2px 0 4px}
.ctlmode button{border:0;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;background:rgba(255,255,255,.12);color:#fff}
.ctlmode button.on{background:#ffe066;color:#4a2a00}
#pad{height:200px;overflow:hidden;display:grid;place-items:center}
.inarea{min-width:0}
.stick-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.stick{position:relative;width:150px;height:150px;flex:none;border-radius:50%;background:radial-gradient(circle,#3b2f8f 0,#221b5c 60%,#14123a 100%);border:4px solid rgba(255,255,255,.35);box-shadow:inset 0 0 0 10px rgba(255,255,255,.05),0 6px 0 rgba(0,0,0,.35);touch-action:none;user-select:none;-webkit-user-select:none}
.stick .thumb{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d0d4e8 60%,#8a8fb5);box-shadow:0 4px 0 #5c5f80,0 0 14px rgba(255,255,255,.4);transition:transform .12s ease}
.stick.held .thumb{transition:none}
.stick .sd{position:absolute;font-style:normal;font-weight:900;font-size:20px;color:rgba(255,255,255,.45)}
.stick .sd.u{top:4px;left:50%;transform:translateX(-50%)}.stick .sd.d{bottom:4px;left:50%;transform:translateX(-50%)}.stick .sd.l{left:8px;top:50%;transform:translateY(-50%)}.stick .sd.r{right:8px;top:50%;transform:translateY(-50%)}
.stick[data-dir="U"] .sd.u,.stick[data-dir="D"] .sd.d,.stick[data-dir="L"] .sd.l,.stick[data-dir="R"] .sd.r{color:#ffe066;text-shadow:0 0 10px #ffe066}
.stick.kpress{animation:none}.stick.kpress .thumb{box-shadow:0 4px 0 #5c5f80,0 0 26px #ffe066}
.erase{background:rgba(255,255,255,.15);color:#fff;white-space:nowrap;padding:3px 12px}
/* 突然変異 */
.mutb{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:900;color:#fff;background:#868e96;white-space:nowrap}
.mcard .mutb{position:absolute;top:30px;left:6px;z-index:2}
.mutb.mr-R{background:#1c7ed6}.mutb.mr-SR{background:#7048e8}.mutb.mr-SSR{background:linear-gradient(135deg,#f59f00,#e8590c)}.mutb.mr-UR{background:linear-gradient(135deg,#e03131,#c2255c)}
.mutb.mr-MR{background:linear-gradient(90deg,#ff6b6b,#ffd43b,#69db7c,#4dabf7,#9775fa);background-size:200% 100%;animation:mutrb 2s linear infinite;text-shadow:0 1px 2px rgba(0,0,0,.5)}
@keyframes mutrb{to{background-position:200% 0}}
.mut{padding:8px 0;border-top:1px solid var(--line)}.mut:first-of-type{border-top:0}.mut.latent{opacity:.65}
.mut-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.mut-h b{font-size:15px}
.mut-cat{font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;background:var(--surface2)}
.mut-fx{margin:2px 0;font-size:12px;font-weight:800;color:#e67700}
.mutcard{border:2px solid #b197fc;background:linear-gradient(135deg,rgba(177,151,252,.12),rgba(99,230,190,.1)),var(--surface)}
.syn{margin-top:6px;padding:6px 8px;border-radius:10px;background:linear-gradient(90deg,#fff3bf,#ffd8f0);color:#5c2d00;font-size:13px}
.mutfx{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#3b1f8f,#0b0720 75%);color:#fff;overflow:auto;display:grid;place-items:center;padding:20px}
.mutfx.mr-SSR{background:radial-gradient(circle at 50% 40%,#e8590c,#3b1100 75%)}.mutfx.mr-UR{background:radial-gradient(circle at 50% 40%,#c2255c,#2b0614 75%)}.mutfx.mr-MR{background:conic-gradient(from 0deg,#ff6b6b,#ffd43b,#69db7c,#4dabf7,#9775fa,#ff6b6b)}
.mutfx-dna{position:absolute;inset:0;pointer-events:none}
.mutfx-dna i{position:absolute;left:calc(50% + (var(--i) - 7) * 22px);top:-20%;width:6px;height:140%;border-radius:4px;background:linear-gradient(transparent,#63e6be,#b197fc,transparent);opacity:.5;animation:mutdna 1.2s ease-in-out calc(var(--i) * .07s) infinite alternate}
@keyframes mutdna{from{transform:scaleY(.4) rotate(12deg)}to{transform:scaleY(1) rotate(-12deg)}}
.mutfx-in{position:relative;text-align:center;max-width:420px;opacity:0;animation:rise .6s ease 1.8s both}
.mutfx-t1{font-size:30px;font-weight:900;letter-spacing:.1em;color:#ffe066;text-shadow:0 0 18px #ff6b6b;margin:0;animation:mutblink .25s steps(2) 6}
@keyframes mutblink{50%{opacity:.2}}
.mutfx-name{margin:6px 0;display:flex;gap:8px;align-items:center;justify-content:center;font-size:24px}.mutfx-name small{font-size:12px;opacity:.85}
.mutfx-first{margin:10px 0;padding:8px 12px;border-radius:12px;background:rgba(255,224,102,.95);color:#4a2a00;font-weight:900;display:grid;gap:4px}.mutfx-first em{font-style:normal;color:#c2255c}
.mutfx-skip{position:fixed;right:14px;top:14px;background:rgba(255,255,255,.2);color:#fff;z-index:51}
.mutfx.skip .mutfx-in,.mutfx.done .mutfx-in{animation:none;opacity:1}.mutfx.skip .mutfx-t1{animation:none}.mutfx.done .mutfx-skip,.mutfx.skip .mutfx-skip{display:none}
@media (prefers-reduced-motion: reduce){.mutfx-dna,.mutfx-t1{animation:none}.mutfx-in{animation:none;opacity:1}}
/* キーを押すたびのエフェクト */
.kfx{position:absolute;pointer-events:none;z-index:8}
.kfx.ring{width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:4px solid var(--c);box-shadow:0 0 18px var(--c);animation:kring .5s ease-out both}
.kfx.fly{margin:-16px 0 0 -12px;font-style:normal;font-weight:900;font-size:28px;color:var(--c);text-shadow:0 0 12px var(--c),0 2px 0 rgba(0,0,0,.5);animation:kfly .42s cubic-bezier(.3,.7,.3,1) both}
.kfx.spark{width:7px;height:7px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);animation:kspark .5s ease-out both}
.kfx.burst{width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffe066 30%,rgba(255,224,102,0) 70%);animation:kburst .6s ease-out both}
.pad button.kpress{animation:kbtn .25s ease}
.slots.kmatch{animation:kglow .6s ease}
.slots.kmiss{animation:shake .35s ease;border-color:#ff8787}
.knear{font-size:12px;font-weight:800;color:#ffe066;margin:4px 0;animation:rise .25s ease}.knear.miss{color:#ffa8a8}
@keyframes kring{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes kfly{0%{transform:translate(0,0) scale(1.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.8);opacity:0}}
@keyframes kspark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes kburst{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.4);opacity:0}}
@keyframes kbtn{0%{filter:brightness(1)}40%{filter:brightness(1.4) drop-shadow(0 0 10px #fff);transform:scale(.92)}100%{filter:brightness(1)}}
@keyframes kglow{0%{box-shadow:0 0 0 rgba(255,224,102,0)}40%{box-shadow:0 0 30px 6px rgba(255,224,102,.9)}100%{box-shadow:0 0 18px rgba(255,224,102,.6)}}
@media (prefers-reduced-motion: reduce){.kfx{display:none}.pad button.kpress,.slots.kmatch,.slots.kmiss{animation:none}}
.slots.match{border-color:#ffe066;box-shadow:0 0 18px rgba(255,224,102,.6)}
.cmdlist{max-height:248px;overflow:auto;font-size:11px;background:rgba(0,0,0,.3);border-radius:12px;padding:6px}
.cmdlist div{padding:3px 4px;border-radius:6px;margin-bottom:3px;background:rgba(255,255,255,.08)}
.cmdlist div.hit{background:rgba(255,224,102,.35)}
.cmdlist b{display:block;font-size:11px}
.cmdlist .cmd{font-size:12px;color:#ffe066}
.pad{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(3,62px);gap:4px;justify-content:center;margin:6px auto}
.pad button{border:0;border-radius:14px;background:linear-gradient(#fff,#d0d4e8);color:#23224a;font-size:28px;font-weight:900;box-shadow:0 4px 0 #8a8fb5;touch-action:manipulation}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a8fb5}
.pad .c{background:transparent;box-shadow:none}
.timer{height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin:6px 0}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#ffe066,#ff6b6b)}
.prompt{text-align:center;font-weight:900;font-size:18px;text-shadow:0 2px 0 rgba(0,0,0,.4);animation:pop .4s ease}
.bt-log{font-size:12px;min-height:34px;background:rgba(0,0,0,.3);border-radius:10px;padding:6px 8px;margin:6px 0}
.ovl{position:absolute;inset:0;display:grid;place-items:center;z-index:5;pointer-events:none}
.ci{position:absolute;left:0;right:0;top:30%;padding:14px 10px;text-align:center;animation:cutin 1.6s cubic-bezier(.2,.9,.2,1) both;z-index:6;pointer-events:none}
.ci b{display:block;font-size:30px;font-weight:900;color:#fff;-webkit-text-stroke:6px rgba(0,0,0,.55);paint-order:stroke fill;letter-spacing:.04em}
.ci small{font-weight:900;font-size:13px;color:#fff;opacity:.95}
.ci.ult b{font-size:34px;color:#fff3bf}
.flashb{position:absolute;inset:0;background:#fff;animation:flash .5s ease both;z-index:4;pointer-events:none}
.dmg{position:absolute;font-size:34px;font-weight:900;color:#fff;-webkit-text-stroke:5px #c92a2a;paint-order:stroke fill;animation:pop .4s ease;z-index:7}
.coin{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3bf,#fab005 60%,#b35c00);display:grid;place-items:center;font-size:36px;animation:flipc 1.8s cubic-bezier(.3,.7,.3,1) both;box-shadow:0 8px 30px rgba(250,176,5,.6)}
.toss{display:grid;gap:10px;justify-items:center;background:rgba(10,8,40,.75);padding:20px 26px;border-radius:20px}
.toss p{margin:0;font-size:20px;font-weight:900;animation:rise .4s ease 1.8s both}
.shake{animation:shake .45s ease}
/* ---- セリ ---- */
.auc-live{background:linear-gradient(135deg,#fff3bf,#ffd8a8);border:2px solid #fab005;color:#4a2a00}
.auc-price{font-size:32px;font-weight:900;color:#c92a2a;text-align:center}
.auc-time{text-align:center;font-weight:900;font-size:22px}
.egg{font-size:90px;animation:eggw .5s ease 4;display:block;text-align:center}
.reveal{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.shout{font-size:26px;font-weight:900;text-align:center;color:#e67700;-webkit-text-stroke:4px #fff;paint-order:stroke fill;margin:6px 0;animation:pop .5s ease}
.inh{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:900;background:linear-gradient(135deg,#ffe066,#ff922b);color:#4a2a00;margin-left:4px}
/* 防御 */
.kd.guard{background:#5c7cfa;color:#fff}
.pdmg.guard{color:#bac8ff;font-size:24px}
.shield{position:absolute;width:120px;height:132px;transform:translate(-50%,-50%);z-index:6;pointer-events:none;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:repeating-linear-gradient(0deg,rgba(186,200,255,.55) 0 4px,rgba(116,143,252,.35) 4px 8px);
  box-shadow:inset 0 0 0 4px #dbe4ff;animation:shield-in 1s steps(6) both}
.shield.hit{animation:shield-in .25s steps(3) both,shield-hit 1.6s steps(10) .25s both}
@keyframes shield-in{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}60%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:.85;transform:translate(-50%,-50%) scale(1)}}
@keyframes shield-hit{0%,30%{filter:brightness(2.2);transform:translate(-50%,-50%) scale(1.12)}15%{transform:translate(-46%,-50%) scale(1.12)}45%{transform:translate(-54%,-50%) scale(1.05)}70%{opacity:.9;filter:none;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}
@media (prefers-reduced-motion:reduce){.shield,.shield.hit{animation:none;opacity:.8}}
</style>
