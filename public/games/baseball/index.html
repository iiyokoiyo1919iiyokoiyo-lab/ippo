<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>IppO ベースボール</title>
<meta name="description" content="IppO ベースボール: 球団を育てて KING を目指す野球ゲーム">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1179x2556.jpg">
<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1284x2778.jpg">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1170x2532.jpg">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1125x2436.jpg">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="icons/splash-828x1792.jpg">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="icons/splash-750x1334.jpg">
<link rel="apple-touch-startup-image" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" href="icons/splash-2048x2732.jpg">
<style>
/* =====================================================================
   IppO ベースボール: 見た目 (ダークネイビー × 白の情報面 × ゴールド)
   ===================================================================== */
:root{--navy:#07112b;--navy2:#0d1d45;--navy3:#14295e;--ink:#0d1b3d;--sub:#5d6888;--line:#e6e9f2;--card:#fff;--gold:#c9a227;--gold2:#e9c46a;--goldg:linear-gradient(135deg,#f3d77a,#c9a227 55%,#a8821a);--red:#d6336c;--ok:#2f9e44;--blue:#2b59c3;color-scheme:light dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--navy);color:#f4f6fb;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;-webkit-text-size-adjust:100%;font-feature-settings:"palt"}
body{background:radial-gradient(1200px 500px at 50% -120px,#1b3a80 0%,rgba(7,17,43,0) 70%),var(--navy);overscroll-behavior-y:none}
a{color:inherit}button{font:inherit;cursor:pointer;color:inherit}
#app{max-width:760px;margin:0 auto;padding:0 12px calc(88px + env(safe-area-inset-bottom));min-height:100vh}
.page{animation:pageIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}}
.num,.kpis b,.ovr,.gr b,.tot b,table.st td{font-variant-numeric:tabular-nums;font-family:"SF Pro Display","Helvetica Neue",Arial,"Hiragino Sans",sans-serif}
/* ---------- 上のバー・下のナビ ---------- */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;margin:0 -12px 12px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:rgba(7,17,43,.82);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid rgba(255,255,255,.07)}
.bar h1{flex:1;min-width:0;margin:0;font-size:17px;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar h1 small{font-size:11px;color:#94a0c4;font-weight:700;margin-left:8px}
.ib{border:0;background:rgba(255,255,255,.08);width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}.ib.logo{font-size:18px}
.souls{display:inline-flex;align-items:center;gap:3px;padding:5px 11px;border-radius:999px;background:rgba(201,162,39,.14);border:1px solid rgba(233,196,106,.45);color:var(--gold2);font-size:13px;white-space:nowrap}.souls b{color:#fff}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:rgba(7,17,43,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.08)}
.tabs a{position:relative;flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#7f8bb0;font-size:10.5px;font-weight:700;padding:5px 0 3px;border-radius:12px;transition:color .2s}
.tabs a.on{color:var(--gold2)}.tabs a.on::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--goldg)}
.tabs a:active{transform:scale(.94)}.tabs .dot{position:absolute;top:0;right:24%;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-style:normal;font-size:10px;display:grid;place-items:center}
/* ---------- カード・文字 ---------- */
.card{background:var(--card);color:var(--ink);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 28px rgba(0,0,0,.28)}
.card.flush{padding:4px 0}.card .pad,.pad{padding:10px 14px}
.card h3,.card h2{margin:0 0 10px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:8px}.ch h3{flex:1;margin:0}.ch a{font-size:12px;font-weight:700;color:var(--blue);text-decoration:none}
.muted{color:var(--sub)}.page>.muted,.page>p.muted{color:#93a0c3}.small{font-size:12px}.center{text-align:center}.gold{color:var(--gold)}.page>.small.gold{color:var(--gold2)}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}
.lbl{margin:12px 0 6px;font-size:12px;font-weight:800;color:var(--sub)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;background:#eef1f8;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:transform .12s,filter .2s}
.btn:active{transform:scale(.97)}.btn.p{background:linear-gradient(135deg,#1f4fbf,#0f2a6b);color:#fff;box-shadow:0 4px 14px rgba(15,42,107,.35)}
.btn.gold{background:var(--goldg);color:#2a1d00;box-shadow:0 4px 16px rgba(201,162,39,.35)}.btn.danger{background:#fff0f3;color:#c2255c}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}.btn.block{display:flex;width:100%}.btn.big{padding:15px;font-size:16px}.btn:disabled{opacity:.45;cursor:not-allowed}
.in{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#f6f7fb;color:var(--ink);font:inherit;font-size:16px}.in:focus{outline:2px solid #9db4ef;background:#fff}
select.in{padding:9px 10px;font-size:14px}.in.mini{width:auto;padding:7px 10px;font-size:13px;background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.15)}
.fl{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:10px}.fl .in{margin-top:4px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:120;background:#fff;color:var(--ink);padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:tIn .3s;max-width:92vw}.toast.err{background:#fff0f3;color:#c2255c}
@keyframes tIn{from{opacity:0;transform:translate(-50%,-10px)}}
.lg{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:999px;font-weight:800;font-size:11.5px;letter-spacing:.03em;color:#fff;vertical-align:middle}
.lg.bronze{background:#8c5a2b}.lg.silver{background:#7d8597}.lg.gold{background:#b88a12}.lg.elite{background:#5f3dc4}.lg.champion{background:linear-gradient(90deg,#c92a2a,#e8590c)}.lg.king{background:var(--goldg);color:#2a1d00}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:800;background:#eef1f8;color:#33416b;margin:2px 3px 0 0;vertical-align:middle}
.chip.sp{background:#ece6ff;color:#5f3dc4}.chip.aw{background:#fff3d6;color:#9a6b00}.chip.star{background:var(--goldg);color:#2a1d00}.chip.new{background:#e6fcf5;color:#087f5b}.chip.real{background:#ffe8cc;color:#d9480f}
.rr{display:inline-block;font-size:10.5px;font-weight:900;padding:0 5px;border-radius:5px;letter-spacing:.02em}.r-N{background:#e9ecef;color:#495057}.r-R{background:#d0ebff;color:#1864ab}.r-SR{background:#efe0ff;color:#7b2fd0}.r-SSR{background:var(--goldg);color:#2a1d00}
.gr{flex:none;width:44px;height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;background:#f2f4fa}.gr b{font-size:18px;font-weight:900}.gr small{font-size:10px;color:var(--sub);margin-top:2px}
.g-S{color:#c2255c}.g-A{color:#e8590c}.g-B{color:#b88a12}.g-C{color:#2f9e44}.g-D{color:#1c7ed6}.g-E{color:#868e96}
.gr.g-S{background:#fff0f6}.gr.g-A{background:#fff4e6}.gr.g-B{background:#fff9db}
.tag{flex:none;font-size:10.5px;font-weight:800;color:var(--sub);background:#f2f4fa;border-radius:8px;padding:3px 7px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- 選手の行 ---------- */
.pl{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f0f2f7;cursor:pointer;color:var(--ink);text-decoration:none;transition:background .15s}.pl:last-child{border-bottom:0}.pl:active{background:#f6f8fc}
.card:not(.flush) .pl{padding:10px 4px}
.pl .pic,.dp .pic,.ob .pic{flex:none;width:46px;height:49px;border-radius:12px;overflow:hidden;display:block;background:#0d1d45}.pl .pic svg,.dp .pic svg,.ob .pic svg{display:block;width:100%;height:100%}
.pl b{display:block;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl small{display:block;color:var(--sub);font-size:11.5px;margin-top:1px}.pl .sl{color:#8a93ad;font-size:11px}.pl .chips{display:block}
.pl.sel input{width:20px;height:20px;accent-color:#0f2a6b;flex:none}.pl.dis{opacity:.45}
/* ---------- ホーム ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:16px;margin-bottom:12px;background:linear-gradient(145deg,#13306f 0%,#0b1a40 55%,#08122d 100%);border:1px solid rgba(233,196,106,.28);box-shadow:0 18px 40px rgba(0,0,0,.4)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(233,196,106,.22),rgba(233,196,106,0) 70%);pointer-events:none}
.hero h2{margin:2px 0 8px;font-size:22px;font-weight:900;letter-spacing:.02em}.hero p{margin:0;color:#b9c3e3;font-size:13px}
.hero-in{display:flex;gap:14px;align-items:center}.hero .emb{filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));flex:none}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:#9fb0dd;margin:0;letter-spacing:.06em}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpis div{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 6px;text-align:center}.kpis b{display:block;font-size:22px;font-weight:800;line-height:1.1}.kpis b small{font-size:11px;font-weight:700;margin:0 1px;color:#c5cde8}.kpis span{font-size:10.5px;color:#9fb0dd}
.prog{height:6px;border-radius:999px;background:rgba(255,255,255,.1);margin:12px 0 0;overflow:hidden}.prog i{display:block;height:100%;background:var(--goldg);border-radius:999px;animation:grow 1s ease-out}
.hero-ft{display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-size:12px;color:#b9c3e3}.hero-ft b{color:#fff}
.alert{display:block;width:100%;text-align:left;border:0;border-radius:16px;padding:12px 14px;margin-bottom:12px;background:#fff;color:var(--ink);font-weight:800;font-size:14px;text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.alert.gold{background:var(--goldg);color:#2a1d00;animation:pulse 2s infinite}.alert b{float:right}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(233,196,106,.25),0 8px 22px rgba(0,0,0,.25)}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:linear-gradient(160deg,#fff,#f3f5fb);color:var(--ink);border-radius:16px;padding:12px;text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,.25)}.tile small{display:block;font-size:11px;font-weight:700;color:var(--sub)}.tile b{display:block;font-size:26px;font-weight:800;margin:2px 0;font-variant-numeric:tabular-nums}.tile span{font-size:11.5px;color:var(--sub)}.tile em{font-style:normal;color:var(--ink);font-weight:700}
.news .nw{display:block;text-decoration:none;padding:10px 0;border-top:1px solid #f0f2f7}.news .nw:first-of-type{border-top:0}
.kick{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:.08em;color:#fff;background:#0f2a6b;padding:1px 7px;border-radius:4px;margin-bottom:4px}
.c-awaken .kick,.c-hof .kick,.c-king .kick{background:var(--goldg);color:#2a1d00}.c-retire .kick{background:#495057}.c-trade .kick{background:#0b7285}.c-draft .kick{background:#c92a2a}.c-rookie .kick{background:#2b8a3e}.c-record .kick{background:#d9480f}.c-promote .kick,.c-season .kick{background:#5f3dc4}.c-special .kick{background:#7048e8}.c-game .kick{background:#5d6888}
.nw b{display:block;font-size:14.5px;font-weight:800;line-height:1.45}.nw small{display:block;font-size:11px;color:var(--sub);margin-top:3px}
.nw.big{padding:4px 0 12px}.nw.big b{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:20px;font-weight:900;line-height:1.35}.nw.big p{margin:6px 0 0;font-size:13px;line-height:1.6;color:#3b4766}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.gm{border:0;border-radius:12px;padding:8px 6px;text-align:center;background:#f4f6fb;color:var(--ink)}.gm b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:12px;color:#fff;background:#adb5bd}.gm.w b{background:#c92a2a}.gm.l b{background:#495057}
.gm span{display:block;font-size:18px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}.gm small{display:block;font-size:10.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.star{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--ink);background:#f6f7fb;border-radius:14px;padding:8px 4px;text-align:center}.star svg{border-radius:12px}.star b{font-size:12.5px;margin-top:4px}.star small{font-size:10.5px;color:var(--sub)}
.cta{display:flex;align-items:center;gap:12px;text-decoration:none;border-radius:18px;padding:14px 16px;margin-bottom:12px;background:linear-gradient(120deg,#c92a2a,#7a0e1c);color:#fff;box-shadow:0 12px 30px rgba(122,14,28,.4)}.cta b{display:block;font-size:16px}.cta small{color:#ffd8d8;font-size:12px}.cta em{font-style:normal;font-weight:800;font-size:13px;white-space:nowrap}
.page>a.cta[href="#tradenew"]{background:linear-gradient(120deg,#0b7285,#0b2a4a)}
.sk{display:grid;gap:12px}.sk i{display:block;height:96px;border-radius:18px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.07);margin-bottom:12px}.seg a{flex:1;text-align:center;padding:9px 6px;border-radius:11px;text-decoration:none;font-weight:800;font-size:13px;color:#a9b4d6}.seg a.on{background:#fff;color:var(--ink)}
.fbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.chipsel{display:flex;gap:6px;flex:1;min-width:0}.chipsel.scroll{overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}.chipsel::-webkit-scrollbar{display:none}
.chipsel button{border:1px solid rgba(255,255,255,.14);background:transparent;color:#c5cde8;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}.chipsel button.on{background:#fff;color:var(--ink);border-color:#fff}
.ord{margin-bottom:6px}.ord b{width:24px;text-align:center;color:var(--sub);font-size:13px}
.sticky{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom));z-index:20;margin-bottom:12px;padding:10px;border-radius:18px;background:rgba(7,17,43,.9);backdrop-filter:blur(10px)}.tsum{font-size:12.5px;text-align:center;margin-bottom:8px;color:#dfe5f7}
/* ---------- 能力のバー ---------- */
.abs{display:grid;gap:8px}.ab{display:grid;grid-template-columns:62px 1fr 22px 46px;gap:8px;align-items:center;font-size:13px;font-weight:700}
.track{position:relative;height:9px;border-radius:999px;background:#eef1f7;overflow:hidden}.track i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.track i.g-S{background:linear-gradient(90deg,#f783ac,#c2255c)}.track i.g-A{background:linear-gradient(90deg,#ffa94d,#e8590c)}.track i.g-B{background:linear-gradient(90deg,#ffe066,#e0a800)}.track i.g-C{background:linear-gradient(90deg,#8ce99a,#2f9e44)}.track i.g-D{background:linear-gradient(90deg,#74c0fc,#1c7ed6)}.track i.g-E{background:#ced4da}
@keyframes grow{from{width:0}}
.ab b{font-size:15px;text-align:center}.ab em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.spr{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}.spr small{color:var(--sub);font-size:12px}
/* ---------- 選手プロフィール ---------- */
.ph{position:relative;overflow:hidden;border-radius:24px;margin-bottom:12px;min-height:290px;display:flex;align-items:flex-end;background:linear-gradient(160deg,#16326f,#07112b);border:1px solid rgba(255,255,255,.1)}
.ph.r-bg-SSR{border-color:rgba(233,196,106,.6)}.ph.r-bg-SR{border-color:rgba(190,120,255,.5)}.ph.hof{border:2px solid var(--gold2);box-shadow:0 0 0 4px rgba(233,196,106,.15),0 20px 40px rgba(0,0,0,.4)}
.ph-art{position:absolute;right:-8px;bottom:-4px;width:230px;max-width:58%;animation:artIn .6s cubic-bezier(.2,.8,.2,1)}.ph-art svg{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 70%,transparent)}
@keyframes artIn{from{opacity:0;transform:translateX(30px) scale(.96)}}
.ph-info{position:relative;z-index:1;padding:16px;max-width:54%;text-shadow:0 1px 8px rgba(7,17,43,.9)}.ph-info h2{margin:6px 0 4px;font-size:24px;font-weight:900;line-height:1.2}.ph-info h2 small{display:block;font-size:13px;color:#9fb0dd;font-weight:700}
.ph-sub{margin:0;font-size:12px;color:#c5cde8}.ph-team{display:flex;align-items:center;gap:6px;margin:8px 0;font-size:12.5px;font-weight:700;color:#dfe5f7}
.ovr{display:inline-flex;align-items:baseline;gap:6px;background:rgba(255,255,255,.1);border-radius:14px;padding:6px 12px;margin-top:6px}.ovr b{font-size:30px;font-weight:900;line-height:1}.ovr span{font-size:20px;font-weight:800;color:#fff}.ovr small{font-size:10.5px;color:#9fb0dd}
.hofb{position:absolute;left:14px;top:14px;z-index:2;background:var(--goldg);color:#2a1d00;border-radius:12px;padding:5px 10px;font-weight:900;font-size:13px}.hofb small{display:block;font-size:10px;font-weight:700}
.ph:has(.hofb) .ph-info{padding-top:62px}
.tw{overflow-x:auto;margin:0 -4px}
table.st{width:100%;border-collapse:collapse;font-size:12.5px}table.st th{color:var(--sub);font-weight:700;font-size:11px;padding:6px 4px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}table.st td{padding:7px 4px;border-bottom:1px solid #f2f4f8;text-align:center;white-space:nowrap}
