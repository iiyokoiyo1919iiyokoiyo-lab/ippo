<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PROJECT BOUNCE</title>
<meta name="theme-color" content="#0b0820">
<style>
/* =====================================================================
   PROJECT BOUNCE: 見た目 (夜空のファンタジー: 深い紫紺 × すりガラスの面 × 金)
   ===================================================================== */
:root{--bg:#0b0820;--bg2:#15103a;--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--line:rgba(255,255,255,.12);--ink:#f5f3ff;--sub:#a8a3d1;--gold:#ffd43b;--gold2:#f59f00;--pink:#ff8cc6;--ok:#51cf66;--ng:#ff6b6b;--goldg:linear-gradient(135deg,#fff3bf,#ffd43b 45%,#f08c00)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% -10%,#2b1f6e,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 58px) 14px calc(env(safe-area-inset-bottom) + 84px)}
.top{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:linear-gradient(rgba(11,8,32,.95),rgba(11,8,32,.7));backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px}
.top .ttl{font-weight:900;letter-spacing:.08em;font-size:15px;background:var(--goldg);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:auto}
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--glass2);font-size:12px;font-weight:800;white-space:nowrap}
.xbtn{width:34px;height:34px;border-radius:50%;background:var(--glass2);font-size:16px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(rgba(11,8,32,.75),rgba(11,8,32,.98));backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.nav a{flex:1;text-align:center;text-decoration:none;font-size:10.5px;color:var(--sub);font-weight:700}
.nav a b{display:block;font-size:21px;line-height:1.25}
.nav a.on{color:var(--gold)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;backdrop-filter:blur(6px)}
h2{font-size:18px;margin:4px 0 12px}h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--sub);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:14px;font-weight:900;font-size:14px;background:var(--glass2);border:1px solid var(--line);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--goldg);color:#3b2200;border:0;box-shadow:0 6px 18px rgba(245,159,0,.35)}
.btn.pink{background:linear-gradient(135deg,#ffb3d9,#e64980);color:#fff;border:0}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px 6px;border-radius:18px;background:var(--glass);border:1px solid var(--line);text-decoration:none;font-weight:900;font-size:13px;min-height:86px}
.tile b{font-size:28px}
.tile small{color:var(--sub);font-weight:700;font-size:10.5px}
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:180px;display:block;text-decoration:none;border:1px solid rgba(255,212,59,.4);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.hero .art{position:absolute;right:-20px;top:-10px;width:62%;height:120%}
.hero .art svg{width:100%;height:100%}
.hero .txt{position:relative;padding:16px;max-width:60%}
.hero .tag{display:inline-block;font-size:10.5px;font-weight:900;padding:3px 8px;border-radius:999px;background:var(--goldg);color:#3b2200}
.hero h3{font-size:20px;margin:8px 0 4px;text-shadow:0 2px 8px #000}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}.bar i{display:block;height:100%;background:var(--goldg);border-radius:9px}
.unit{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/5;background:#120d2e;border:2px solid var(--rc,#555);text-decoration:none;display:block}
.unit svg{width:100%;height:100%;display:block}
.unit .lv{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:900;padding:1px 6px;border-radius:9px;background:rgba(0,0,0,.6)}
.unit .rar{position:absolute;right:4px;top:4px;font-size:10px;font-weight:900;padding:1px 6px;border-radius:9px;background:var(--rc);color:#1a1033}
.unit .at{position:absolute;left:4px;top:3px;font-size:14px}
.unit.locked svg{filter:grayscale(1) brightness(.25)}
.unit.sel{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}
.list > *{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list > *:last-child{border-bottom:0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.tabs button{flex:none;padding:8px 12px;border-radius:999px;background:var(--glass);font-size:12.5px;font-weight:800;color:var(--sub)}
.tabs button.on{background:var(--goldg);color:#3b2200}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);z-index:90;padding:10px 16px;border-radius:12px;background:#1f1a4a;border:1px solid var(--line);font-weight:800;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90vw}
.toast.ng{background:#5c1a2b}
.input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font:inherit;font-size:15px}
.detail-art{border-radius:22px;overflow:hidden;border:2px solid var(--rc);box-shadow:0 0 40px color-mix(in srgb,var(--rc) 45%,transparent)}
.detail-art svg{display:block;width:100%;height:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}.kv b{color:var(--sub);font-weight:700}
.skill{padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.25);margin-top:8px;font-size:13px}.skill b{color:var(--gold)}
/* 戦闘 */
.battle{position:fixed;inset:0;z-index:40;background:#05030f;display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.bhud{width:100%;max-width:460px;padding:calc(env(safe-area-inset-top) + 6px) 10px 4px;display:flex;flex-direction:column;gap:5px}
.bhud .hp{height:12px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}.bhud .hp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#51cf66,#94d82d);transition:width .3s}
.bhud .hp s{position:absolute;inset:0 auto 0 0;background:rgba(116,192,252,.6);text-decoration:none}
.bwrap{position:relative;flex:1;width:100%;max-width:460px;display:flex;align-items:center;justify-content:center;min-height:0}
canvas.field{display:block;max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.order{display:flex;gap:6px;justify-content:center}
.order span{width:42px;height:42px;border-radius:50%;overflow:hidden;border:2px solid #333;opacity:.6;position:relative;background:#120d2e}
.order span.cur{border-color:var(--gold);opacity:1;transform:scale(1.12);box-shadow:0 0 12px var(--gold)}
.order span svg{width:100%;height:100%}
.order span em{position:absolute;bottom:-1px;left:0;right:0;font-size:9px;font-style:normal;text-align:center;background:rgba(0,0,0,.65);font-weight:900}
.bbot{width:100%;max-width:460px;padding:6px 10px calc(env(safe-area-inset-bottom) + 8px);display:flex;gap:8px;align-items:stretch}
.blog{flex:1;height:64px;overflow:hidden;font-size:11px;color:var(--sub);line-height:1.45;background:rgba(255,255,255,.05);border-radius:10px;padding:5px 8px}
.blog p{margin:0}
.spbtn{width:96px;border-radius:14px;font-weight:900;font-size:12px;background:var(--glass2);border:1px solid var(--line);line-height:1.25}
.spbtn.ready{background:var(--goldg);color:#3b2200;animation:pulse 1.2s infinite}
.spbtn.on{background:linear-gradient(135deg,#ff8cc6,#7048e8);color:#fff}
@keyframes pulse{50%{box-shadow:0 0 18px var(--gold)}}
.bmsg{position:absolute;left:0;right:0;top:44%;text-align:center;font-weight:900;font-size:26px;text-shadow:0 3px 12px #000;pointer-events:none}
.result{position:fixed;inset:0;z-index:60;background:rgba(5,3,15,.88);display:flex;align-items:center;justify-content:center;padding:20px}
.result .card{width:100%;max-width:420px;text-align:center}
/* ガチャの演出 */
.gfx{position:fixed;inset:0;z-index:80;background:#05030f;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.gfx .orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--oc,#74c0fc) 40%,#1b1446);box-shadow:0 0 60px var(--oc);animation:orbin 1s cubic-bezier(.2,1.4,.4,1)}
@keyframes orbin{from{transform:translateY(60vh) scale(.3)}}
.gfx .reveal{width:min(78vw,340px);animation:rv .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes rv{from{transform:scale(.2) rotate(-8deg);opacity:0}}
.gfx .nm{margin-top:14px;font-size:22px;font-weight:900;text-shadow:0 0 18px var(--oc)}
.gfx .tp{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 22px);color:var(--sub);font-size:12px}
.gfx.cosmos{background:radial-gradient(circle at 50% 45%,#3b2a7a,#05030f 70%)}
.gfx .circle{position:absolute;width:150vmin;height:150vmin;border-radius:50%;border:2px solid rgba(255,224,102,.7);box-shadow:0 0 40px rgba(255,224,102,.5),inset 0 0 40px rgba(255,224,102,.4);animation:spin 6s linear infinite,grow 1.4s ease-out}
.gfx .circle.c2{width:110vmin;height:110vmin;border-style:dashed;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes grow{from{transform:scale(0)}}
.gfx .shoot{position:absolute;width:2px;height:90px;background:linear-gradient(transparent,#fff);top:-100px;animation:fall 1.4s linear infinite}
@keyframes fall{to{transform:translate(-40vw,130vh)}}
.gfx .ttlx{position:absolute;top:18%;font-size:14px;letter-spacing:.4em;color:var(--gold);font-weight:900;animation:rv 1s}
.gfx .flash{position:absolute;inset:0;background:#fff;animation:fl 1s forwards;pointer-events:none}@keyframes fl{to{opacity:0}}
.gfx .bolt{position:absolute;top:0;width:8px;height:60vh;background:linear-gradient(#fff,#ffe066,transparent);filter:drop-shadow(0 0 14px #ffe066);animation:fl .5s infinite}
.loading{text-align:center;padding:60px 0;color:var(--sub)}
/* 戦闘画面 (リニューアル): 上の情報バー・フィールド・下のバー */
.battle{background:#0a0818;gap:0}
.bt-top{width:100%;max-width:520px;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 10px 4px}
.bt-q{flex:1;min-width:0}.bt-q b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bt-q small{font-size:10px;color:var(--gold);letter-spacing:.05em}
.bt-c{text-align:center;line-height:1.1}.bt-c b{display:block;font-size:14px;font-weight:900;letter-spacing:.08em;background:var(--goldg);-webkit-background-clip:text;background-clip:text;color:transparent}.bt-c small{font-size:10px;color:var(--sub)}
.bt-menu{flex:none;width:38px;height:38px;border-radius:12px;background:linear-gradient(#2b2560,#1a1640);border:1px solid rgba(255,255,255,.18);font-size:20px;font-weight:900;color:#fff;margin-left:8px}
.bt-bars{width:100%;max-width:520px;padding:0 10px 4px;display:flex;flex-direction:column;gap:4px}
.bt-hpbar{position:relative;height:16px;border-radius:9px;background:#120e2a;border:1.5px solid rgba(255,255,255,.25);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.bt-hpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#8ce99a,#2f9e44);transition:width .35s}.bt-hpbar i.mid{background:linear-gradient(#ffe066,#f08c00)}.bt-hpbar i.low{background:linear-gradient(#ff8787,#c92a2a)}
.bt-hpbar s{position:absolute;inset:0 auto 0 0;background:rgba(116,192,252,.55);text-decoration:none}
.bt-hpbar span{position:absolute;right:8px;top:0;font-size:10.5px;font-weight:900;line-height:13px;text-shadow:0 1px 2px #000}
.bt-boss[hidden]{display:none}.bt-boss{display:flex;align-items:center;gap:6px}.bt-boss em{font-style:normal;font-size:11px;font-weight:900;color:#ff8787;white-space:nowrap}
.bt-bossbar{flex:1;height:10px;border-radius:6px;background:#2a0a12;border:1.5px solid #ff8787;overflow:hidden}.bt-bossbar i{display:block;height:100%;background:linear-gradient(#ff6b6b,#a61e1e);transition:width .35s}
.bt-order{display:flex;gap:4px;font-size:10px;color:var(--sub);overflow:hidden;white-space:nowrap}.bt-order span{padding:1px 6px;border-radius:9px;background:rgba(255,255,255,.06)}.bt-order span.cur{background:var(--goldg);color:#3b2200;font-weight:900}
.bwrap{flex:1;padding:0 6px}
canvas.field{border-radius:12px;box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 0 3px rgba(255,212,59,.35),0 10px 30px rgba(0,0,0,.6)}
.bt-ticker{position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:86%;padding:3px 10px;border-radius:9px;background:rgba(10,8,24,.62);font-size:11px;font-weight:800;opacity:0;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-ticker.on{animation:tick 2.4s forwards}@keyframes tick{0%{opacity:0}8%,75%{opacity:1}100%{opacity:0}}
.bmsg.on{animation:popin .3s cubic-bezier(.2,1.5,.4,1)}@keyframes popin{from{transform:scale(.6);opacity:0}}
.bt-bot{width:100%;max-width:520px;display:grid;grid-template-columns:72px 1fr 76px;gap:6px;align-items:stretch;padding:6px 8px calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(#1c1640,#0e0b24);border-top:2px solid rgba(255,212,59,.45)}
.bt-thp{display:flex;flex-direction:column;justify-content:center;padding:4px 6px;border-radius:10px;background:rgba(0,0,0,.35);line-height:1.15}.bt-thp small{font-size:9.5px;color:var(--sub);font-weight:800}.bt-thp b{font-size:14px;font-weight:900;color:#8ce99a}
.bt-mini{height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin:2px 0}.bt-mini i{display:block;height:100%;background:#51cf66;transition:width .35s}
.bt-faces{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.bt-face{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid var(--ac);background:#120d2e;padding:0;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.bt-face svg{width:100%;height:125%;display:block;margin-top:-6%}
.bt-face em{position:absolute;left:2px;top:2px;min-width:20px;height:20px;border-radius:50%;background:#1a1033;border:1.5px solid var(--ac);font-style:normal;font-size:11px;font-weight:900;line-height:17px;text-align:center;color:#fff}
.bt-face i{position:absolute;right:2px;bottom:1px;font-style:normal;font-size:12px}
.bt-face.sp em{background:var(--goldg);color:#3b2200;border-color:#fff3bf;animation:pulse 1.2s infinite}
.bt-face.cur{border-color:#fff3bf;box-shadow:0 0 12px rgba(255,236,153,.8);transform:translateY(-3px)}
.bt-side{display:flex;flex-direction:column;gap:5px}
.bt-speed{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:rgba(0,0,0,.35);line-height:1.1}.bt-speed small{font-size:9.5px;color:var(--sub)}.bt-speed b{font-size:17px;font-weight:900}
.bt-side .spbtn{width:auto;min-height:40px;font-size:11px;padding:2px}.bt-side .spbtn small{display:block;font-size:8.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-sheet{position:absolute;inset:0;z-index:5;background:rgba(5,3,15,.7);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.bt-sheet .card{width:100%;max-width:460px;background:#1a1540;max-height:70vh;overflow:auto}
.bt-log{max-height:40vh;overflow:auto;font-size:12px;color:var(--sub)}.bt-log p{margin:0;padding:3px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<header class="top"><button class="xbtn" id="exit" aria-label="閉じる">✕</button><span class="ttl">PROJECT BOUNCE</span><span class="pill" id="h-st">⚡ -</span><span class="pill" id="h-gem">💎 -</span></header>
<main class="app" id="app"><div class="loading">読みこみ中…</div></main>
<nav class="nav" id="nav">
  <a href="#home" data-n="home"><b>🏠</b>ホーム</a><a href="#quests" data-n="quests"><b>⚔️</b>クエスト</a><a href="#lobby" data-n="lobby"><b>👥</b>マルチ</a><a href="#gacha" data-n="gacha"><b>✨</b>ガチャ</a><a href="#units" data-n="units"><b>🃏</b>キャラ</a>
</nav>
<script src="/cards-art.js"></script>
<script src="bn-data.js?v=3"></script>
<script src="bn-core.js?v=3"></script>
<script src="bn-art.js?v=3"></script>
<script src="bn-field.js?v=3"></script>
<script src="bn.js?v=3"></script>
</body>
</html>
