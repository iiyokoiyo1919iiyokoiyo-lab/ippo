# Fly.io 用設定: fly launch --copy-config --no-deploy && fly volumes create ippo_data --size 1 && fly deploy
app = "ippo"
primary_region = "nrt"

[build]

[env]
  NODE_ENV = "production"
  VB_MAX_SESSIONS = "3"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[mounts]
  source = "ippo_data"
  destination = "/data"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
